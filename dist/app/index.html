<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#222}
#root{display:flex;flex-direction:column}
.panel{min-height:100%}
.hdr{padding:50px 20px 30px;background:#1a73e8;text-align:center}

.sec .st{font-size:13px;color:#333;line-height:1.6}
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.none{text-align:center;padding-top:60px;color:#bbb;font-size:14px;line-height:1.8}
.none .ic{font-size:40px;margin-bottom:10px}
.hide{display:none}
.rwrap{padding:0 16px 16px}
.rc{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}

.rc .cat{font-size:12px;color:#888}
.rc .haz{font-size:15px;font-weight:600;color:#222;margin-bottom:4px}
.rc .msr{font-size:12px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhdr{padding:12px 20px 20px;background:#1a73e8}
.dhdr .pa{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:6px}
.dhdr .nm{font-size:20px;font-weight:700;color:#fff}

.tbl-cell-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tbl-cell-imgs img,.tbl-image img{display:block;max-width:220px;max-height:150px;object-fit:contain;border-radius:5px;cursor:pointer;background:#fff}
.tbl-image{padding:0 10px 10px;overflow-x:auto}
/* 首页 */
.home-panel{--home-bg:#f4f7fa;--home-surface:#fff;--home-border:#e1e8ef;--home-text:#172536;--home-muted:#607187;--home-primary:#0c5f9f;--home-action:#103f67;display:flex;min-height:100%;flex-direction:column;overflow-y:auto;background:var(--home-bg);color:var(--home-text)}

.hero-copy{margin:0}.hero-copy h1{font-size:30px;line-height:1.08;font-weight:750;letter-spacing:.01em}.hero-copy h1 span{display:block;margin-top:8px;font-size:16px;font-weight:500;letter-spacing:.05em;color:rgba(255,255,255,.84)}
.home-content{display:flex;flex:1;flex-direction:column;padding:24px 20px calc(20px + env(safe-area-inset-bottom))}.home-section-head{margin-bottom:16px}.home-section-title{font-size:17px;font-weight:700;letter-spacing:.01em;color:var(--home-text)}.home-section-sub{margin-top:6px;font-size:13px;line-height:1.5;color:var(--home-muted)}
.road-card{display:flex;align-items:center;min-height:96px;margin-bottom:12px;padding:16px;border:1px solid var(--home-border);border-radius:16px;background:var(--home-surface);box-shadow:0 4px 16px rgba(29,54,79,.045);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease}.road-card:active{background:#f7fafc;border-color:#cedae5;box-shadow:0 2px 8px rgba(29,54,79,.06)}.road-card-gsg{--road-color:#126bb3;--road-wash:#edf5fc}.road-card-rural{--road-color:#18795d;--road-wash:#edf7f3}

.about-entry{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;margin:auto auto 0;padding:16px 12px 8px;color:var(--home-muted);font-size:12px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:color .14s ease}.about-entry:active{color:var(--home-primary)}.about-entry .about-entry-icon{display:flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid currentColor;border-radius:50%;font-size:10px;font-weight:700}
.road-card:focus-visible,.search-cta:focus-visible,.about-entry:focus-visible{outline:3px solid #7fc4ff;outline-offset:2px}
.about-panel{background:#f4f7fa;color:#172536}.about-panel .nav{padding:24px 16px 8px;padding:max(24px,env(safe-area-inset-top,0px)) 16px 8px;background:#0c5f9f}.about-panel .nav:after{content:'';flex:0 0 48px;height:48px}.about-panel .nav .bk{display:flex;align-items:center;justify-content:center;flex:0 0 48px;width:48px;height:48px;padding:0;border-radius:12px;color:rgba(255,255,255,.92);touch-action:manipulation;-webkit-tap-highlight-color:transparent}.about-panel .nav .bk:active{background:rgba(255,255,255,.12)}.about-panel .nav .bk svg{width:22px;height:22px}.about-panel .nav .tt{text-align:center;font-size:16px;font-weight:650;letter-spacing:.01em}.about-panel .nav .bk:focus-visible{outline:3px solid #8bd0ff;outline-offset:1px}
.about-screen{padding:28px 20px calc(28px + env(safe-area-inset-bottom));background:#f4f7fa}.about-hero{width:100%;max-width:380px;margin:0 auto;padding:16px 8px 34px;text-align:center}.about-logo{width:84px;height:84px;overflow:hidden;margin:0 auto;border:1px solid rgba(23,49,75,.08);border-radius:24px;background:#137ddd;box-shadow:0 10px 24px rgba(18,68,108,.13)}.about-logo img{display:block;width:100%;height:100%;object-fit:cover}.about-hero h3{margin-top:17px;color:#172536;font-size:21px;line-height:1.35;font-weight:750;letter-spacing:.01em}.about-hero p{max-width:290px;margin:8px auto 0;color:#5f7185;font-size:13px;line-height:1.6}.about-info{width:100%;max-width:380px;overflow:hidden;margin:0 auto;border:1px solid #e0e7ee;border-radius:16px;background:#fff}.about-row{display:grid;grid-template-columns:minmax(88px,auto) minmax(0,1fr);align-items:center;min-height:64px;gap:20px;padding:0 16px}.about-row+.about-row{border-top:1px solid #edf1f5}.about-row-label{color:#607187;font-size:13px;line-height:1.45}.about-row-value{color:#1d2d40;font-size:14px;line-height:1.45;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}.about-note{width:100%;max-width:380px;margin:24px auto 0;padding:20px 4px 0;border-top:1px solid #dde5ec;color:#5f7185;font-size:12px;line-height:1.75;text-align:left}
/* 宽屏网页预览：以手机机身展示，移动设备仍保持全屏体验。 */
@media (min-width:600px) and (min-height:600px){
  html,body{overflow:hidden;background:radial-gradient(circle at 50% 18%,#e0f1ff 0,#f4f8fc 36%,#e8eef5 100%)}
  body{display:flex;align-items:center;justify-content:center;padding:22px}
  #root{position:relative;flex:none;width:min(430px,calc(100vw - 44px));height:min(880px,calc(100vh - 44px));overflow:hidden;border:8px solid #1d2d40;border-radius:39px;background:#f5f7fa;box-shadow:0 28px 70px rgba(32,53,80,.26),0 9px 24px rgba(32,53,80,.18)}
  #root:before{content:'';position:absolute;z-index:20;left:50%;top:0;width:112px;height:23px;transform:translateX(-50%);border-radius:0 0 15px 15px;background:#1d2d40;pointer-events:none}
  #root:after{content:'';position:absolute;z-index:20;left:50%;bottom:8px;width:105px;height:4px;transform:translateX(-50%);border-radius:999px;background:rgba(255,255,255,.76);pointer-events:none}
  .panel{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .home-panel{overflow-y:auto}
}
@media(prefers-color-scheme:dark){
  body{background:#0c1218;color:#eee}

  .home-panel{--home-bg:#0e1720;--home-surface:#15212c;--home-border:#263746;--home-text:#f0f5f9;--home-muted:#b0bdc9;--home-primary:#6ebcf4;--home-action:#176aa6}
  .home-hero{background:#0b4f86}.road-card{box-shadow:none}.road-card:active{background:#1a2a38;border-color:#385064}.road-card-gsg{--road-color:#76bdf0;--road-wash:#18354b}.road-card-rural{--road-color:#78cdb0;--road-wash:#19382f}.road-arrow{color:#9aabba}.search-cta:active{background:#115884}.about-entry:active{color:#8bcbf7}
  .about-panel,.about-screen{background:#0e1720;color:#f0f5f9}.about-panel .nav{background:#0b4f86}.about-logo{border-color:#33495c;box-shadow:none}.about-hero h3{color:#f0f5f9}.about-hero p{color:#a7b6c4}.about-info{border-color:#2b3c4b;background:#15212c}.about-row+.about-row{border-color:#263746}.about-row-label{color:#a7b6c4}.about-row-value{color:#f0f5f9}.about-note{border-color:#263746;color:#9aabba}
}
@media(prefers-reduced-motion:reduce){.road-card,.search-cta,.about-entry{transition:none}.lb-overlay{animation:none}}

/* Editorial interface refresh — inspired by spacious reading and music layouts. */
:root{--paper:#f7f7f4;--surface:#fff;--ink:#15202c;--muted:#697683;--line:#e5e8ea;--blue:#0d5f9f;--blue-deep:#103a5d;--blue-soft:#eef5fa;--green:#397c69;--green-soft:#eef6f2;--shadow:0 16px 42px rgba(28,45,61,.055)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);letter-spacing:.005em}
#root,.panel{background:var(--paper)}
.panel{display:flex;min-height:100%;flex-direction:column}
.nav{position:relative;z-index:4;display:flex;align-items:center;min-height:68px;padding:max(18px,env(safe-area-inset-top,0px)) 18px 8px;border-bottom:1px solid rgba(30,52,70,.08);background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

.shdr,.dhdr{padding:25px 24px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.shdr:before,.dhdr:before{display:block;margin-bottom:9px;color:var(--blue);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.shdr:before{content:"ROAD SECTION"}.dhdr:before{content:"HAZARD GUIDE"}
.shdr h2,.dhdr .nm{margin:0;color:var(--ink);font-family:"Songti SC","STSong",serif;font-size:25px;font-weight:650;line-height:1.32;letter-spacing:.015em}.shdr p{margin-top:8px;color:var(--muted);font-size:12px}.dhdr .pa{margin:0 0 7px;color:var(--muted);font-size:11px;line-height:1.5}
.scr{flex:1;overflow-y:auto;padding:20px 18px calc(30px + env(safe-area-inset-bottom));scrollbar-width:none}.scr::-webkit-scrollbar,.home-panel::-webkit-scrollbar{display:none}
.cd{display:flex;align-items:center;min-height:76px;margin-bottom:12px;padding:16px 16px;border:1px solid var(--line);border-left-width:1px;border-radius:18px;background:var(--surface);box-shadow:0 8px 28px rgba(24,42,57,.035);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.cd:active{transform:scale(.992);border-color:#cbd5db;box-shadow:0 3px 14px rgba(24,42,57,.05)}.cd .ti{color:var(--ink);font-size:15px;font-weight:620;line-height:1.45}.cd .sb{margin-top:5px;color:var(--muted);font-size:11px;letter-spacing:.02em}.cd .ar{display:flex;align-items:center;justify-content:flex-end;min-width:46px;height:44px;margin-left:8px;color:#96a1aa;font-size:12px}.cd .bg{width:30px;height:30px;margin-right:13px;border:1px solid #d8e5ee;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-size:11px}.iw{width:42px;height:42px;margin-right:14px;border-radius:50%;font-size:0}.iw svg{width:21px;height:21px;color:var(--blue)}
.sec{margin-bottom:16px;padding:19px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 9px 30px rgba(24,42,57,.035)}.section-title{display:flex;align-items:center;gap:9px;margin:0 0 14px;color:var(--ink);font-size:14px;font-weight:700;letter-spacing:.035em}.section-title-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:var(--blue);background:var(--blue-soft)}.section-title-icon svg{width:17px;height:17px}.sec p,.step span{color:#34424e!important;font-size:13px!important;line-height:1.78!important}.step{margin-bottom:17px}.step:last-child{margin-bottom:0}
.img-grid{gap:12px}.img-item{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fbfbfa;box-shadow:none;cursor:pointer}.img-item img{display:block;width:100%;height:148px;object-fit:cover;background:#f2f3f2}.img-item .img-cap{position:static;padding:10px 11px 11px;background:transparent;color:#57636d;font-size:10px;line-height:1.55;text-align:center}

let DATA=null;
function normalizeRuralNames(rural){
  const strip=name=>typeof name=='string'?name.replace(/^4(?:\.\d+)+\s*/, ''):name;
  for(const category of rural.cat||[]){
    category.n=strip(category.n);
    for(const hazard of category.h||[]){
      hazard.n=strip(hazard.n);
      for(const sub of hazard.sub||[]){
        sub.n=strip(sub.n);
        for(const detail of sub.sub||[])detail.n=strip(detail.n);
      }
    }
  }
  return rural;
}
function loadData(){
  const dataVersion='20260904-160228';
  const readJson=(url,fallback)=>fetch(url,{cache:'no-store'}).then(response=>{
    if(!response.ok)throw new Error(`Request failed: ${response.status}`);
    return response.json();
  }).catch(()=>fallback);
  return Promise.all([
    readJson(`assets/gsg_data.json?v=${dataVersion}`,{name:'普通国省道',desc:'普通国省道交通事故多发路段治理手册',cat:[]}),
    readJson(`assets/rural_data.json?v=${dataVersion}`,{name:'农村公路',desc:'农村公路交通事故多发路段治理手册',cat:[]})
  ]).then(([gsg,rural])=>{
    DATA={gsg,rural:normalizeRuralNames(rural)};
    render();
  });
}

const root=document.getElementById('root');
function h(t,a,...k){
  const e=document.createElement(t);
  if(a)for(const[n,v]of Object.entries(a)){
    if(n=='cn')e.className=v;

    else if(n=='ph')e.placeholder=v;
    else if(n=='st'&&typeof v=='object')Object.assign(e.style,v);
    else if(n=='val')e.value=v;
    else e.setAttribute(n,v);
  }
  for(const c of k){if(c==null)continue;if(Array.isArray(c)){c.forEach(x=>e.append(typeof x=='string'?document.createTextNode(x):x));continue}
  e.append(typeof c=='string'?document.createTextNode(c):c)}
  return e
}
function D(c,...r){
  if(r.length&&typeof r[0]=='object'&&!Array.isArray(r[0])&&!(r[0] instanceof Node))
    return h('div',{cn:c,...r[0]},...r.slice(1));
  return h('div',{cn:c},...r)
}

function tapProps(action,label){
  return {
    role:'button',tabindex:'0','aria-label':label,onclick:action,
    onkeydown:event=>{
      if(event.key=='Enter'||event.key==' '){event.preventDefault();action()}
    }

}

  const e=document.createElementNS('http://www.w3.org/2000/svg',t);
  if(a)for(const[n,v]of Object.entries(a))e.setAttribute(n,v);

  document.body.appendChild(ov);

function closeLightbox(){
  const ov=document.querySelector('.lb-overlay');

function isNumericTableCell(text){
  const value=String(text||'').trim();
  return value.length>0
    &&/[0-9０-９ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/.test(value)
    && !/[\u3400-\u9fff]/.test(value);
}

function tableView(table,pfx){
  const rows=table.rows||[];
  const details=h('details',rows.length>20?{}:{open:''},
    h('summary',{},h('span',{cn:'summary-icon','aria-hidden':'true'},uiIcon('table')),table.n+(rows.length?'（'+rows.length+'行）':'')),
    ...(rows.length?[D('tbl-wrap',{},
      h('table',{cn:'hb-table'},h('tbody',{},...rows.map((row,ri)=>
        h('tr',{},...row.map(raw=>{
          const cell=typeof raw=='string'?{text:raw,imgs:[]}:raw;
          const spanAttrs={};
          if(cell.colspan>1)spanAttrs.colspan=cell.colspan;
          if(cell.rowspan>1)spanAttrs.rowspan=cell.rowspan;
          if(isNumericTableCell(cell.text))spanAttrs.cn='num-cell';
          return h(ri==0?'th':'td',spanAttrs,
            cell.text||'',
            cell.imgs&&cell.imgs.length?D('tbl-cell-imgs',{},...cell.imgs.map(f=>
              h('img',{src:'assets/'+pfx+'/'+f,loading:'lazy',onclick:()=>openLightbox('assets/'+pfx+'/'+f,table.n),onerror:e=>e.target.style.display='none'})
            )):null
          )
        }))
      )))
    )]:[]),
    ...(table.imgs&&table.imgs.length?[D('tbl-image',{},...table.imgs.map(f=>
      h('img',{src:'assets/'+pfx+'/'+f,loading:'lazy',onclick:()=>openLightbox('assets/'+pfx+'/'+f,table.n),onerror:e=>e.target.style.display='none'})
    ))]:[])
  );
  return D('tbl-card',details)
}

  )]:[]

      D('img-item',{onclick:()=>openLightbox('assets/'+pfx+'/'+f,(figure.captions&&figure.captions[f])||figure.caption||'')},
        h('img',{src:'assets/'+pfx+'/'+f,loading:'lazy',st:{height:'auto',maxHeight:'360px',objectFit:'contain',background:'#f5f7fa'},onerror:e=>e.target.parentElement.style.display='none'}),
        ((figure.captions&&figure.captions[f])||figure.caption)?h('div',{cn:'img-cap'},(figure.captions&&figure.captions[f])||figure.caption):null
      )

function prefaceViews(owner,pfx){

      )))
    )];
    return [];
  });
}

function updateSearchResults(){
  const box=document.getElementById('sres');
  if(!box)return;
  let res=[];
  if(searchQ.trim()){
    const kw=searchQ.toLowerCase().trim().split(/[\s,\u3001\u3001]+/).filter(Boolean);
    for(const type of['gsg','rural']){
      const label=type=='gsg'?'普通国省道':'农村公路';
      DATA[type].cat.forEach((cat,ci)=>{
        cat.h.forEach((haz,hi)=>{
          if(haz.sub){
            haz.sub.forEach((sub,si)=>{
              if(sub.sub){
                sub.sub.forEach((ss,sji)=>{
                  const txt=(cat.n+' '+haz.n+' '+sub.n+' '+ss.n+' '+(ss.p||'')+' '+(ss.m||[]).map(m=>m.text||m).join(' ')).toLowerCase();
                  const m=kw.filter(k=>txt.includes(k)).length;
                  if(m>0)res.push({type,label,c:cat.n+'>'+haz.n+'>'+sub.n,h:ss.n,m:ss.m,ci,hi,si,sji,score:m/kw.length})
                })
              } else {
                const txt=(cat.n+' '+haz.n+' '+sub.n+' '+(sub.p||'')+' '+(sub.m||[]).map(m=>m.text||m).join(' ')).toLowerCase();
                const m=kw.filter(k=>txt.includes(k)).length;
                if(m>0)res.push({type,label,c:cat.n+'>'+haz.n,h:sub.n,m:sub.m,ci,hi,si,score:m/kw.length})
              }
            })
          } else {
            const txt=(cat.n+' '+haz.n+' '+(haz.p||'')+' '+(haz.m||[]).map(m=>m.text||m).join(' ')).toLowerCase();
            const m=kw.filter(k=>txt.includes(k)).length;
            if(m>0)res.push({type,label,c:cat.n,h:haz.n,m:haz.m,ci,hi,score:m/kw.length})
          }
        })
      })
    }
    res.sort((a,b)=>b.score-a.score);
    if(searchTab!='all')res=res.filter(x=>x.type==searchTab)
  }
  box.innerHTML='';
  if(res.length>0){
    res.forEach(r=>{
      const detailProps=r.sji!==undefined?{id:r.type,ci:r.ci,hi:r.hi,si:r.si,sji:r.sji}:r.si!==undefined?{id:r.type,ci:r.ci,hi:r.hi,si:r.si}:{id:r.type,ci:r.ci,hi:r.hi};
      box.appendChild(D('rc',{onclick:()=>nav('HazardDetail',detailProps)},
        D('tag',{},r.label),D('cat',{},r.c),D('haz',{},r.h)
      ))
    })
  } else {
    box.appendChild(D('none',D('ic',{},uiIcon('search')),(searchQ.trim()?'未找到匹配结果':'输入隐患关键词\n如："视距不足"、"护栏缺失"、"照明不足"')))
  }
}

  return D('panel',

}
